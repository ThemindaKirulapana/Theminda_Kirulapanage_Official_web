<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#060810">
  <link rel="icon" type="image/x-icon" href="images/logo.png">
  <title>Loading portfolio</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #060810;
      color: #e8eaf0;
      font-family: "DM Sans", "Segoe UI", sans-serif;
    }

    .loader {
      width: min(320px, calc(100vw - 48px));
      text-align: center;
    }

    .monogram {
      position: relative;
      display: grid;
      width: 88px;
      height: 88px;
      margin: 0 auto 28px;
      place-items: center;
      border: 1px solid rgba(0, 229, 255, 0.35);
      border-radius: 24px;
      color: #00e5ff;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -3px;
      animation: glow 1.4s ease-in-out infinite alternate;
    }

    .monogram::before {
      position: absolute;
      inset: -7px;
      border: 2px solid transparent;
      border-top-color: #00e5ff;
      border-right-color: #7c3aed;
      border-radius: 28px;
      content: "";
      animation: spin 1.5s linear infinite;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.08em;
    }

    p {
      margin: 8px 0 24px;
      color: #8a91a3;
      font-size: 13px;
    }

    .progress {
      height: 9px;
      overflow: hidden;
      border-radius: 3px;
      background: #1b2030;
    }

    .progress span {
      display: block;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #7c3aed, #00e5ff , #0ae323);
      transform: scaleX(0);
      transform-origin: left;
    }

    .percent {
      margin-top: 14px;
      color: #00e5ff;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.12em;
      font-variant-numeric: tabular-nums;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes glow {
      to { box-shadow: 0 0 36px rgba(0, 229, 255, 0.2); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="loader" aria-live="polite">
    <div class="monogram" aria-hidden="true">
      <image src="images/logo.png" alt="Renuka Theminda" width="48" height="48">
    </div>
    <h1>Renuka Theminda</h1>
    <p>Get in touch</p>

    <div class="progress" role="progressbar" aria-label="Loading portfolio" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <span id="bar"></span>
    </div>
    <div class="percent" id="percent">0%</div>
  </main>
  <script>
    (function () {
      var DURATION = 2800;
      var bar = document.getElementById('bar');
      var label = document.getElementById('percent');
      var track = document.querySelector('.progress');
      var start = null;

      function ease(t) {
        return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      }

      function tick(now) {
        if (start === null) start = now;
        var t = Math.min((now - start) / DURATION, 1);
        var p = ease(t);
        var pct = Math.round(p * 100);

        bar.style.transform = 'scaleX(' + p + ')';
        label.textContent = pct + '%';
        track.setAttribute('aria-valuenow', pct);

        if (t < 1) {
          requestAnimationFrame(tick);
        } else {
          window.setTimeout(function () {
            window.location.replace('./?intro-complete=1');
          }, 250);
        }
      }

      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
